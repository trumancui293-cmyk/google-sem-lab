        { id: "kw-cheap", prompt: "cheap office chair 的主要问题是？", options: [{ id: "vol", label: "搜索量太小，不值得看" }, { id: "price", label: "$429 的椅子接不住低价需求" }, { id: "ban", label: "这个词不能写进广告" }], answer: "price", why: "这个词搜索量不小，但对方想买便宜椅子。点击会发生，转化很差，CPA 会高于目标。先从广告组里拿掉。" },

    const STOP = new Set(["for", "the", "a", "an", "of", "to", "and", "me"]);

    function money(value, digits = 0) {
      return value.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: digits, maximumFractionDigits: digits });
    }
    function tokens(value) {
      return value.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
    }
    function usable(value, max) { return value.trim().length > 0 && value.length <= max; }
    function validLines(lines, max) { return lines.filter((line) => usable(line, max)); }
    function expectedCtr(headlines, descriptions) {
      const heads = validLines(headlines, 30);
      const descs = validLines(descriptions, 90);
      const all = [...heads, ...descs].join(" ").toLowerCase();
      const headText = heads.join(" ").toLowerCase();
      let score = 4;
      if (/\b(shop|buy|order|trial)\b/.test(headText)) score += 2;
      if (/\d/.test(all)) score += 2;
      if (all.includes("aerosit")) score += 1;
      if (heads.length >= 3 && descs.length >= 2) score += 1;
      return Math.max(2, Math.min(10, score));
    }
    function relevanceScore(keyword, headlines, descriptions) {
      const heads = validLines(headlines, 30).join(" ").toLowerCase();
      const descs = validLines(descriptions, 90).join(" ").toLowerCase();
      const words = tokens(keyword.text).filter((word) => !STOP.has(word));
      const inHeadline = words.some((word) => heads.includes(word));
      const inDescription = words.some((word) => descs.includes(word));
      let score = inHeadline ? 8 : inDescription ? 5 : 3;
      if (keyword.intent === "wrong" && !inHeadline && !inDescription) score = 2;
      if (keyword.intent === "local") score = Math.min(score, 3);
      return score;
    }
    function qualityScore(expected, relevance, landing) {
      return Math.max(1, Math.min(10, Math.round((expected + relevance + landing) / 3)));

    function runAuction(qs, bid) {

      const auction = runAuction(qs, m.maxCpc);
      const result = auction.shown
        ? callout("info", `实际 CPC ${money(auction.cpc, 2)}`, `${auction.nextName ? `下一名是 ${esc(auction.nextName)}，广告评级 ${auction.nextRank.toFixed(1)}。实际 CPC = ${auction.nextRank.toFixed(1)} ÷ ${qs} + $0.01 = ${auction.rawCpc.toFixed(2)}。` : `你是最后一名，按展示门槛 ${RESERVE_RANK} 计算。实际 CPC = ${RESERVE_RANK} ÷ ${qs} + $0.01 = ${auction.rawCpc.toFixed(2)}。`}${auction.cpc + 0.001 < auction.rawCpc ? ` 计算结果高于最高出价，所以封顶在 ${money(m.maxCpc, 2)}。` : ` 最高出价是 ${money(m.maxCpc, 2)}，这次不用付满。`}`)
        : callout("warning", "这次没有展示", `广告评级 ${auction.rank.toFixed(1)}，低于展示门槛 ${RESERVE_RANK}。提高最高 CPC，或回到广告步骤把相关性、标题和着陆页做上去。`);
      return `<section class="stack"><h2>看一次拍卖怎么排名</h2><p>广告评级 = 最高 CPC × 质量得分。评级低于 ${RESERVE_RANK} 时，本模型不给展示。实际 CPC = 下一名的广告评级 ÷ 你的质量得分 + $0.01，并且不超过你的最高出价。三家竞争对手的出价和质量分是固定的。</p>${pills(m.active.map((item) => ({ id: item.id, label: item.short })), m.focus.id, "focus")}<p><b>${esc(m.focus.text)}</b></p><div class="row"><span>最高 CPC</span><input id="bid" data-bid type="number" min="0" step="0.01" value="${esc(state.bidText)}"></div><p>预期点击率 ${m.expected}，相关性 ${relevance}，着陆页 ${m.landingScore}，质量分 ${qs}。广告评级 = ${money(m.maxCpc, 2)} × ${qs} = ${auction.rank.toFixed(1)}。</p>${table(["广告主", "质量分", "最高 CPC", "广告评级", "排名"], auction.rows.map((row) => [row.you ? "AeroSit（你）" : esc(row.name), String(row.qs), money(row.bid, 2), row.rank.toFixed(1), row.position ? `第 ${row.position} 位` : "未展示"]), auction.rows.map((row) => row.you ? (auction.shown ? "you" : "warn") : ""), 1)}${result}<p class="lede">这个广告组共用一个最高 CPC。购买词和低价词如果放在一起，就会用同一个价去拍两种意图。</p>${practice("auction")}</section>`;
    }
    function stepMonth(m) {
      const empty = m.active.length === 0 || !m.result.eligibleAds;
      let body = "";
      if (empty) {
        body = callout("warning", m.result.eligibleAds ? "没有关键词可算" : "没有合格广告可算", m.result.eligibleAds ? "先在选词里留下至少一个关键词。" : "标题和描述都需要至少一条在字数以内的文案。");
      } else {
        const tone = (value, good, mid) => value == null ? "warn" : value <= good ? "good" : value <= mid ? "warn" : "bad";
        const chartRows = m.result.rows.filter((row) => row.cost > 0).sort((a, b) => b.cost - a.cost);
        const maxCost = chartRows[0] ? chartRows[0].cost : 1;
        const chart = chartRows.length ? `<div class="usage" aria-label="月预算使用">${chartRows.map((row) => `<i style="width:${(row.cost / MONTHLY_BUDGET) * 100}%;background:${SPEND_COLORS[KEYWORDS.findIndex((keyword) => keyword.id === row.id) % SPEND_COLORS.length]}"></i>`).join("")}</div><p class="fine">月预算已使用 ${Math.round((m.spend / MONTHLY_BUDGET) * 100)}% · ${money(m.spend)} / ${money(MONTHLY_BUDGET)}。色块从左到右按花费排序：${chartRows.map((row) => `${row.short} ${money(row.cost)}`).join("，")}</p><h3>30 天模拟花费按关键词</h3><div class="bars">${chartRows.map((row) => `<div class="bar-row"><span>${esc(row.short)}</span><div class="bar"><i style="width:${Math.max(2, (row.cost / maxCost) * 100)}%"></i></div><span>${money(Math.round(row.cost))}</span></div>`).join("")}</div><p class="fine">来源：本页教学拍卖模型 · 日预算 $60 × 30 天 · 竞争对手出价固定 · 花费为四舍五入后的点击乘以实际 CPC</p>` : "";
        const tones = m.result.rows.map((row) => {
          if (row.clicks === 0) return "warn";
          if (row.intent === "wrong" || row.intent === "local" || row.intent === "price") return "bad";
          if (row.conversions > 0 && row.cost / row.conversions <= TARGET_CPA) return "good";
          if (row.conversions > 0 && row.cost / row.conversions <= BREAK_EVEN_CPA) return "warn";
          return "bad";
        });
        body = `<p>30 天预估展示 ${m.impressions.toLocaleString("en-US")} 次，点击 ${m.clicks.toLocaleString("en-US")} 次${m.impressions ? `（点击率 ${((m.clicks / m.impressions) * 100).toFixed(1)}%）` : ""}，花费 ${money(m.spend)}，转化 ${m.conversions.toFixed(1)} 单。</p><div class="stats"><div class="stat ${tone(m.cpa, TARGET_CPA, BREAK_EVEN_CPA)}"><b>${m.cpa == null ? "—" : money(m.cpa)}</b><span>实际 CPA</span></div><div class="stat ${m.spend > 0 ? (m.roas >= 4 ? "good" : m.roas >= 1 ? "warn" : "bad") : "warn"}"><b>${m.spend > 0 ? `${m.roas.toFixed(1)}x` : "—"}</b><span>ROAS</span></div><div class="stat ${m.contribution > 0 && m.cpa != null && m.cpa <= TARGET_CPA ? "good" : m.contribution > 0 ? "warn" : "bad"}"><b>${money(m.contribution)}</b><span>广告后毛利</span></div></div>${chart}${table(["关键词", "质量分", "排名", "花费", "转化", "CPA"], m.result.rows.map((row) => { const rowCpa = cpaOf(row.cost, row.conversions); return [esc(row.text), String(row.qs), row.position ? `第 ${row.position} 位` : "未展示", money(row.cost), row.conversions.toFixed(1), rowCpa == null ? "—" : money(rowCpa)]; }), tones, 1)}<p class="fine">行颜色：达到目标 CPA 为好，低价、不相关、到店为差，有点击但偏贵为警告，没拿到点击同样标成警告。</p>`;
      }
      return `<section class="stack"><h2>用 30 天结果做判断</h2><p class="lede">日预算 ${money(DAILY_BUDGET)} 连续跑 30 天，月预算 ${money(MONTHLY_BUDGET)}。搜索量用月搜索量，展示份额和点击率随排名变化。改前面的词、文案、着陆页或出价，这页会重算。</p>${body}${monthNotes(m)}${practice("month")}</section>`;
    }

    function view() {
      const m = model();
      const index = STEPS.findIndex((item) => item.id === state.step);
      const body = state.step === "map" ? stepMap(m) : state.step === "keywords" ? stepKeywords() : state.step === "ads" ? stepAds(m) : state.step === "auction" ? stepAuction(m) : stepMonth(m);
      return `<h1>Google 搜索广告实训</h1><p class="lede">案例是 AeroSit Pro，一把卖到美国的人体工学椅。售价 ${money(PRICE)}，毛利率 45%，所以保本获客成本是 ${money(BREAK_EVEN_CPA)}。这轮练习的目标，是把 CPA 控制在 ${money(TARGET_CPA)} 以内。</p><p class="fine">拍卖和 30 天数字来自本页的教学模型：手动 CPC、竞争对手出价固定、不含季节和受众。用来建立直觉，不是 Google Ads 后台导出。</p><div class="stats"><div class="stat"><b>${money(PRICE)}</b><span>售价</span></div><div class="stat"><b>${money(BREAK_EVEN_CPA)}</b><span>保本 CPA</span></div><div class="stat info"><b>${money(TARGET_CPA)}</b><span>目标 CPA</span></div><div class="stat"><b>${money(DAILY_BUDGET)}</b><span>日预算</span></div></div>${pills(STEPS, state.step, "step")}<div class="split"></div>${body}<div class="nav"><button class="btn" data-move="-1"${index <= 0 ? " disabled" : ""}>上一步</button><button class="btn primary" data-move="1"${index >= STEPS.length - 1 ? " disabled" : ""}>下一步</button></div>`;
    }
    function render() {
      const active = document.activeElement;
      const id = active && active.id;
      const start = active && active.selectionStart;
      const end = active && active.selectionEnd;
      document.getElementById("app").innerHTML = view();
      if (id) {
        const next = document.getElementById(id);
        if (next) {
          next.focus();
          if (start != null && next.setSelectionRange) next.setSelectionRange(start, end);
        }
      }
      save();
    }
    document.getElementById("app").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.step) state.step = button.dataset.step;
      if (button.dataset.focus) state.focusId = button.dataset.focus;
      if (button.dataset.quiz) state.answers[button.dataset.quiz] = button.dataset.option;
      if (button.dataset.move) {
        const index = STEPS.findIndex((item) => item.id === state.step) + Number(button.dataset.move);
        if (STEPS[index]) state.step = STEPS[index].id;
      }
      if (button.dataset.preset === "good") { state.selected = ["buy", "lumbar", "alt", "best"]; state.match = "phrase"; }
      if (button.dataset.preset === "bad") { state.selected = ["cheap", "stand", "near", "ergo"]; state.match = "broad"; }
      if (button.dataset.copy === "strong") { state.headlines = [...STRONG_HEADLINES]; state.descriptions = [...STRONG_DESCRIPTIONS]; }
      if (button.dataset.copy === "weak") { state.headlines = [...WEAK_HEADLINES]; state.descriptions = [...WEAK_DESCRIPTIONS]; }
      render();
    });
    document.getElementById("app").addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.match) state.match = target.value;
      if (target.dataset.landing) state.landing = target.value;
      if (target.dataset.kw) {
        const id = target.dataset.kw;
        state.selected = target.checked ? (state.selected.includes(id) ? state.selected : [...state.selected, id]) : state.selected.filter((item) => item !== id);
      }
      render();
    });
    document.getElementById("app").addEventListener("input", (event) => {
      const target = event.target;
      if (target.dataset.headline != null) state.headlines[Number(target.dataset.headline)] = target.value;
      if (target.dataset.description != null) state.descriptions[Number(target.dataset.description)] = target.value;
      if (target.dataset.bid != null) state.bidText = target.value;
      if (target.dataset.headline != null || target.dataset.description != null || target.dataset.bid != null) render();
    });
    render();
  </script>
</body>
</html>
